<!DOCTYPE html>
<html>
<head>
    <title>Add Image</title>
</head>
<body>
    <header>
        <h1>Add a New Image</h1>
    </header>
    <main>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Image</button>
        </form>
        <a href="{% url 'home' %}">Back to Gallery</a>
    </main>
</body>
</html>
